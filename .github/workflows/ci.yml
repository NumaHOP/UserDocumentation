name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build

      - name: Rename build to public
        run: mv build public

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: public
          path: public/
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: public

  notify-nhask:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - name: Trigger NHASK pipeline
        run: |
          curl --fail --request POST \
            --form token="${{ secrets.NHASK_TRIGGER_TOKEN }}" \
            --form ref=main \
            "https://gitlab.huma-num.fr/api/v4/projects/humatheque-condorcet%2Foutils-numeriques%2Fnhask/trigger/pipeline"
